name: Build Windows package

on:
  workflow_dispatch:
    # 手动构建：可用 inputs.tag 指定版本号，自动打 tag 并发布 Release。
    inputs:
      tag:
        description: '发布版本号（如 v0.2.0）。留空则只构建不发布。'
        required: false
        default: ''
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: windows-x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/release/probe-rs-ui.exe" `
            -DestinationPath "dist/probe-rs-ui-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-rs-ui-windows-x86_64
          path: dist/probe-rs-ui-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag (manual release)
        if: steps.tag.outputs.tag != '' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Publish GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/probe-rs-ui-windows-x86_64.zip
          generate_release_notes: true

