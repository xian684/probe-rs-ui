name: Build platform packages

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            package: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            package: macos-aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/probe-rs-ui-${{ matrix.package }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" probe-rs-ui

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: probe-rs-ui-${{ matrix.package }}
          path: dist/probe-rs-ui-${{ matrix.package }}.tar.gz
          if-no-files-found: error
          retention-days: 30
