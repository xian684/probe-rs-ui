[package]
name = "probe-rs-ui"
version = "0.1.0"
edition = "2021"
description = "基于 probe-rs 与 egui 的嵌入式固件图形化烧录工具"
license = "MIT"

[package.metadata.winresource]
FileDescription = "Probe-rs 烧录工具（嵌入式固件图形化烧录）"
ProductName = "Probe-rs Flasher"
LegalCopyright = "Copyright (c) 2026"
OriginalFilename = "probe-rs-ui.exe"

[dependencies]
eframe = "0.31"
probe-rs = "0.32"
target-gen = "0.32"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = "debuginfo"
