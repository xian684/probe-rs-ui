[package]
name = "probe-rs-ui"
version = "0.1.0"
edition = "2021"
description = "基于 probe-rs 与 egui 的嵌入式固件图形化烧录工具"
license = "MIT"
authors = ["xian684 <x2093747535@qq.com>"]
repository = "https://github.com/xian684/probe-rs-ui"
readme = "README.md"
keywords = ["probe-rs", "embedded", "flashing", "debug", "egui"]
categories = ["development-tools::debugging", "embedded", "gui"]

[package.metadata.winresource]
FileDescription = "Probe-rs 烧录工具（嵌入式固件图形化烧录）"
ProductName = "Probe-rs Flasher"
LegalCopyright = "Copyright (c) 2026"
OriginalFilename = "probe-rs-ui.exe"

[dependencies]
eframe = "0.31"
probe-rs = "0.32"
target-gen = "0.32"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = "debuginfo"
# 减少生成的二进制体积：panic 直接 abort（不展开栈回溯），
# 单代码生成单元 + 全量内联，换取更小体积与更好性能。
panic = "abort"
codegen-units = 1
opt-level = 3
